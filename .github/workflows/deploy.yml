name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID || vars.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID || vars.KV_NAMESPACE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Require deploy config
        run: |
          missing=
          for k in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID KV_NAMESPACE_ID; do
            eval "v=\${$k}"
            [ -n "$v" ] || missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required GitHub secrets/vars:$missing"
            exit 1
          fi

      - name: Substitute binding IDs
        env:
          WEB_ORIGIN: ${{ secrets.WEB_ORIGIN || vars.WEB_ORIGIN }}
          API_ORIGIN: ${{ secrets.API_ORIGIN || vars.API_ORIGIN }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          api = pathlib.Path("apps/api/wrangler.jsonc")
          text = api.read_text()
          for key in ("D1_DATABASE_ID", "KV_NAMESPACE_ID"):
              text = text.replace("${" + key + "}", os.environ[key])
          origin = os.environ.get("WEB_ORIGIN")
          if origin:
              text = re.sub(r'("WEB_ORIGIN"\s*:\s*")[^"]*"', rf"\1{origin}\"", text)
          api.write_text(text)
          web_origin = os.environ.get("API_ORIGIN")
          if web_origin:
              web = pathlib.Path("apps/web/wrangler.jsonc")
              web.write_text(re.sub(r'("API_ORIGIN"\s*:\s*")[^"]*"', rf"\1{web_origin}\"", web.read_text()))
          PY

      - name: Apply D1 migrations
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply duskly --remote

      - name: Deploy API
        working-directory: apps/api
        run: pnpm exec wrangler deploy

      - name: Deploy web
        working-directory: apps/web
        run: pnpm run deploy
